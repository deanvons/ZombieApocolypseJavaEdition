spring.application.name=zombie-apocalypse

# Defaults point at the local Docker database (docker-compose.yml).
# On Render, set DB_URL, DB_USERNAME and DB_PASSWORD to the production database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/zombies}
spring.datasource.username=${DB_USERNAME:zombie}
spring.datasource.password=${DB_PASSWORD:zombie}

# Schema is generated from the entity classes.
# 'update' only adds tables/columns - renames and removals need manual SQL.
# Never use 'create' or 'create-drop' here: they wipe the database on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath*:data/*.sql

# Give up waiting for a database connection after 5s (default 30s), so failures surface quickly
spring.datasource.hikari.connection-timeout=5000

# The Keycloak realm that issues tokens (must match the token's "iss" claim exactly).
# Keycloak 17+ has no /auth prefix. Override with KEYCLOAK_ISSUER_URI, e.g. for a local Keycloak.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://keycloak-26-2-jrtn.onrender.com/realms/Zombie%20Apocalypse}
